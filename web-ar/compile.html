<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本尊识别图编译（开发工具）</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="diagnostic"><main>
  <h1>本尊识别图编译</h1>
  <p>在电脑浏览器中运行。编译本地部署的 tssgd.jpg，下载 tssgd.mind 后放到服务器同目录的 assets/ 中。只需编译一次，手机端不需要执行此步骤。</p>
  <button id="compile">编译识别图</button>
  <p id="progress" role="status">待编译</p>
</main>
<script type="module">
  import { Compiler } from './vendor/mindar-image.prod.js';
  const button = document.querySelector('#compile');
  const progress = document.querySelector('#progress');
  button.addEventListener('click', async () => {
    button.disabled = true;
    try {
      const img = new Image(); img.src = './assets/tssgd.jpg'; await img.decode();
      const compiler = new Compiler();
      await compiler.compileImageTargets([img], percent => { progress.textContent = '编译中 ' + Math.round(percent) + '%'; });
      const data = await compiler.exportData();
      const url = URL.createObjectURL(new Blob([data], {type:'application/octet-stream'}));
      const a = document.createElement('a'); a.href = url; a.download = 'tssgd.mind'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      progress.textContent = '已生成，请将 tssgd.mind 放入服务器 assets/ 目录。';
    } catch (error) { progress.textContent = '编译失败：' + error.message; }
    finally { button.disabled = false; }
  });
</script>
</body></html>
